services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.22
    restart: unless-stopped
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY в .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY в .env}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweed_data:/data

volumes:
  pgdata:
  seaweed_data: